<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo 🚀</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: #0f172a;
      overflow: hidden;
    }

    /* Luces de fondo */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.5;
      z-index: -1;
    }

    body::before {
      background: #7c3aed;
      top: -100px;
      left: -100px;
    }

    body::after {
      background: #06b6d4;
      bottom: -100px;
      right: -100px;
    }

    .card {
      width: 90%;
      max-width: 650px;
      padding: 60px 40px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      backdrop-filter: blur(15px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      animation: aparecer 1s ease;
    }

    .emoji {
      font-size: 60px;
      margin-bottom: 20px;
      animation: flotar 3s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin-bottom: 15px;
      background: linear-gradient(90deg, #a78bfa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #cbd5e1;
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 999px;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 10px 30px rgba(6, 182, 212, 0.3);
    }

    #mensaje {
      margin-top: 25px;
      min-height: 24px;
      color: #67e8f9;
      font-weight: bold;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes flotar {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="emoji">👋</div>

    <h1>¡Hola, Mundo!</h1>

    <p>
      Mi primer proyecto web está vivo 🚀
    </p>

    <button onclick="saludar()">
      Haz clic aquí
    </button>

    <div id="mensaje"></div>
  </main>

  <script>
    function saludar() {
      document.getElementById("mensaje").textContent =
        "¡Bienvenido a mi repositorio de GitHub! 💻✨";
    }
  </script>

</body>
</html>
